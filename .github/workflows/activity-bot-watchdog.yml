# Watchdog disabled: it used to start activity-bot.yml when the Actions
# worker died. The bot now runs outside GitHub; do not re-enable the cron.
name: Activity bot watchdog

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kick:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo "watchdog disabled"
