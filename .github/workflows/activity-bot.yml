# detectx_bot no longer runs on GitHub Actions (hosted runners stop ~6h).
# This stub stays so a merge to main cancels any leftover Actions bot via
# concurrency, then exits. Do not add workflow_dispatch or a long-running job.
name: Activity bot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/activity-bot.yml"

concurrency:
  group: activity-bot
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "GitHub Actions bot disabled; leftover runs are cancelled by concurrency."
