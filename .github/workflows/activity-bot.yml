# Keep detectx_bot polling while this repo lives on GitHub.
# GitHub Pages only serves the UI; this worker is the always-on process.
#
# One-time: repo Settings → Secrets and variables → Actions
#   TELEGRAM_BOT_TOKEN   (required)
#   TELEGRAM_CHAT_ID     (optional secret or Actions variable)
#
# Then merge to main (schedule only runs on the default branch) and send
# /start to https://t.me/detectx_bot while a run is in progress.
# After the first bind, chat id is cached and written to the
# TELEGRAM_CHAT_ID Actions variable so a cancel/restart does not wait
# for another /start. If Telegram is silent after a restart, message
# the bot once — pending /start updates are consumed by the previous run.
#
# Jobs last ~6h (runner cap). The next schedule overlaps so the bot
# restarts with only a short gap.

name: Activity bot

on:
  schedule:
    # Every 5h55m — inside the 6h job limit, with overlap from concurrency.
    - cron: "5 */6 * * *"
  workflow_dispatch:
    inputs:
      chat_id:
        description: "Telegram chat id (skips waiting for /start)"
        required: false
        type: string
      replay:
        description: "Re-alert the current activity window instead of seeding quietly"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: activity-bot
  cancel-in-progress: true

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Restore checkpoint
        uses: actions/cache@v4
        with:
          path: data/activity-bot-state.json
          # Unique key so each run can save; restore-keys reuse the latest.
          key: activity-bot-state-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            activity-bot-state-v2-
            activity-bot-state-v1
          save-always: true

      - name: Run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || vars.TELEGRAM_CHAT_ID }}
          DISPATCH_CHAT_ID: ${{ github.event.inputs.chat_id }}
          REPLAY: ${{ github.event.inputs.replay }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ]; then
            echo "Set repo secret TELEGRAM_BOT_TOKEN" >&2
            exit 1
          fi
          chat="${DISPATCH_CHAT_ID:-}"
          chat="${chat:-${TELEGRAM_CHAT_ID:-}}"
          chat="$(printf '%s' "$chat" | tr -cd '0-9-')"
          extra=()
          if [ -n "$chat" ]; then
            extra+=(-chat "$chat")
          else
            echo "No TELEGRAM_CHAT_ID (secret, variable, or dispatch input)." >&2
            echo "If this is a restart, send any message to https://t.me/detectx_bot" >&2
          fi
          if [ "${REPLAY:-}" = "true" ]; then
            extra+=(-replay)
            echo "replay: will alert the current activity window" >&2
          fi
          mkdir -p data

          persist_chat_id() {
            local last=""
            while true; do
              sleep 20
              [ -f data/activity-bot-state.json ] || continue
              id="$(python3 -c 'import json; d=json.load(open("data/activity-bot-state.json")); print(d.get("chat_id") or "")' 2>/dev/null || true)"
              case "$id" in
                ''|0) continue ;;
              esac
              if [ "$id" = "$last" ]; then
                continue
              fi
              if gh variable set TELEGRAM_CHAT_ID --body "$id"; then
                echo "saved Actions variable TELEGRAM_CHAT_ID" >&2
                last="$id"
              fi
            done
          }
          persist_chat_id &

          go build -o /tmp/activity-bot ./cmd/activity-bot
          while true; do
            /tmp/activity-bot -state data/activity-bot-state.json "${extra[@]}" || true
            echo "bot exited, restarting in 5s" >&2
            sleep 5
          done
