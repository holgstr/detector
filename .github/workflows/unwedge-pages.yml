name: Unwedge Pages

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/unwedge-pages.yml"

permissions:
  contents: write
  pages: write
  deployments: write
  actions: write

jobs:
  unwedge:
    runs-on: ubuntu-latest
    steps:
      - name: Recreate Pages site (legacy main /docs)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"

          echo "::group::Cancel + delete any deployments"
          for sha in $(gh api "repos/$REPO/deployments?environment=github-pages&per_page=30" --jq '.[].sha' 2>/dev/null || true); do
            gh api -X POST "repos/$REPO/pages/deployments/$sha/cancel" >/dev/null 2>&1 || true
          done
          for id in $(gh api "repos/$REPO/deployments?environment=github-pages&per_page=30" --jq '.[].id' 2>/dev/null || true); do
            gh api -X POST "repos/$REPO/deployments/$id/statuses" -f state=inactive >/dev/null 2>&1 || true
            gh api -X DELETE "repos/$REPO/deployments/$id" >/dev/null 2>&1 || true
          done
          echo "::endgroup::"

          echo "::group::Delete Pages site"
          gh api -X DELETE "repos/$REPO/pages" -i | head -1 || true
          # Give GitHub a moment to drop the site
          sleep 5
          echo "::endgroup::"

          echo "::group::Create Pages site (legacy, main, /docs)"
          # Retry create a few times — delete can be eventually consistent
          for attempt in 1 2 3 4 5; do
            if gh api -X POST "repos/$REPO/pages" \
              -f build_type=legacy \
              -f 'source[branch]=main' \
              -f 'source[path]=/docs'; then
              echo "created on attempt $attempt"
              break
            fi
            echo "create attempt $attempt failed; sleeping"
            sleep 5
          done
          echo "::endgroup::"

          echo "::group::Final status"
          sleep 3
          gh api "repos/$REPO/pages" || true
          gh api "repos/$REPO/pages/builds/latest" || true
          echo "::endgroup::"
