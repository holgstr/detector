name: Unwedge Pages

# Manual only — never run this in the same workflow as deploy-pages.
# Cancelling by commit SHA poisons that SHA; push a new commit after unwedge.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  deployments: write
  actions: write

jobs:
  unwedge:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Clear stuck deployments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"

          for id in $(gh run list --repo "$REPO" --workflow=pages-build-deployment --status in_progress --json databaseId --jq '.[].databaseId' 2>/dev/null || true); do
            gh run cancel "$id" --repo "$REPO" >/dev/null 2>&1 || true
          done
          for id in $(gh run list --repo "$REPO" --workflow=pages-build-deployment --status queued --json databaseId --jq '.[].databaseId' 2>/dev/null || true); do
            gh run cancel "$id" --repo "$REPO" >/dev/null 2>&1 || true
          done

          for sha in $(gh api "repos/$REPO/deployments?environment=github-pages&per_page=50" --jq '.[].sha' 2>/dev/null || true); do
            gh api -X POST "repos/$REPO/pages/deployments/$sha/cancel" >/dev/null 2>&1 || true
          done
          for id in $(gh api "repos/$REPO/deployments?environment=github-pages&per_page=50" --jq '.[].id' 2>/dev/null || true); do
            gh api -X POST "repos/$REPO/deployments/$id/statuses" -f state=inactive >/dev/null 2>&1 || true
            gh api -X DELETE "repos/$REPO/deployments/$id" >/dev/null 2>&1 || true
          done

          echo "Cleared. Push a NEW commit to main (or merge a PR) so deploy uses a fresh SHA."
          echo "Do not re-run an old workflow for a cancelled SHA — it will fail again."
          gh api "repos/$REPO/pages" --jq '{status,build_type,html_url}' || true
