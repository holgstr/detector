<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>detector · markets</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="wrap">
    <h1>Markets</h1>
    <p class="sub">Active Yes/No markets by tag and 24h volume. Strength = two-way share of holdings from wallets with lifetime PnL &gt; $100k.</p>

    <div class="bar">
      <label class="field search">Search
        <input id="q" type="search" placeholder="Filter loaded markets" autocomplete="off" />
      </label>
      <label class="field">Tag
        <select id="tag">
          <option value="elections" selected>elections</option>
          <option value="politics">politics</option>
          <option value="geopolitics">geopolitics</option>
          <option value="crypto">crypto</option>
          <option value="sports">sports</option>
        </select>
      </label>
      <label class="field">Min 24h vol
        <input id="minVol" type="number" min="0" step="1000" value="10000" />
      </label>
      <button id="load" type="button">Load</button>
    </div>

    <div class="meta" id="meta"></div>
    <div class="meta"><span>tag <b id="tagLabel">—</b></span></div>
    <div id="err" class="err" hidden></div>

    <table>
      <thead>
        <tr>
          <th class="sortable num active" data-key="volume_24hr" data-dir="↓">24h vol</th>
          <th class="sortable" data-key="question">Market</th>
          <th class="num hide-sm">Y / N</th>
          <th class="sortable num" data-key="yes_strength">Strength Y/N</th>
          <th class="sortable num hide-sm" data-key="stronger">Side</th>
          <th class="sortable num hide-sm" data-key="strength_edge">Edge</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <p id="empty" class="sub" hidden>No markets match.</p>
  </div>
  <script src="./app.js" defer></script>
</body>
</html>
