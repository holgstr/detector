<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Detector</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://data-api.polymarket.com" crossorigin />
  <link rel="preconnect" href="https://gamma-api.polymarket.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="wrap">
    <header class="top">
      <h1>Detector</h1>
      <nav class="tabs" role="tablist" aria-label="Main">
        <button type="button" class="tab active" role="tab" aria-selected="true" data-tab="markets">Markets</button>
        <button type="button" class="tab" role="tab" aria-selected="false" data-tab="flows">Flows</button>
        <button type="button" class="tab" role="tab" aria-selected="false" data-tab="portfolio">Portfolio</button>
        <button type="button" class="tab" role="tab" aria-selected="false" data-tab="activity">Activity</button>
      </nav>
    </header>

    <section id="tab-markets" class="tab-panel active" role="tabpanel">
      <div class="bar">
        <label class="field search">Search
          <input id="q" type="search" placeholder="Filter loaded markets" autocomplete="off" />
        </label>
        <label class="field">Tag
          <select id="tag">
            <option value="elections" selected>elections</option>
            <option value="politics">politics</option>
            <option value="geopolitics">geopolitics</option>
            <option value="crypto">crypto</option>
            <option value="sports">sports</option>
          </select>
        </label>
        <label class="field">Min 24h vol
          <input id="minVol" type="number" min="0" step="1000" value="10000" />
        </label>
        <label class="field" title="Minimum sharps on the net-favored side (Yes or No)">Min sharps (side)
          <input id="minFavoredSharps" type="number" min="0" step="1" value="0" />
        </label>
        <label class="field" title="At least this many sharps traded this market in the last Y hours">Min recent sharps
          <input id="minRecentSharps" type="number" min="0" step="1" value="0" />
        </label>
        <label class="field" title="Lookback window for recent sharp trades">Within hours
          <input id="recentHours" type="number" min="1" step="1" value="24" />
        </label>
        <label class="field" title="Hide markets where Yes or No price is above this (¢). 0 = off.">Max price ¢
          <input id="maxPriceCts" type="number" min="0" max="100" step="1" value="0" />
        </label>
        <button id="load" type="button">Load</button>
      </div>

      <div class="meta" id="meta"></div>
      <div class="meta"><span>tag <b id="tagLabel">—</b></span></div>
      <div id="err" class="err" hidden></div>

      <table>
        <thead>
          <tr>
            <th class="expand-h" aria-hidden="true"></th>
            <th class="sortable num active" data-key="volume_24hr" data-dir="↓">24h vol</th>
            <th class="sortable" data-key="question">Market</th>
            <th class="num hide-sm">Y / N</th>
            <th class="sortable num" data-key="net_shares_abs">Shares Y/N</th>
            <th class="sortable num" data-key="net_strength_abs">Strength Y/N</th>
            <th class="sortable num" data-key="net_traders_abs">Traders Y/N</th>
            <th class="sortable num hide-sm" data-key="stronger">Side</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <p id="empty" class="sub" hidden>No markets match.</p>
    </section>

    <section id="tab-flows" class="tab-panel" role="tabpanel" hidden>
      <div class="bar">
        <label class="field search">Search
          <input id="flowQ" type="search" placeholder="Filter loaded markets" autocomplete="off" />
        </label>
        <label class="field">Tag
          <select id="flowTag">
            <option value="elections" selected>elections</option>
            <option value="politics">politics</option>
            <option value="geopolitics">geopolitics</option>
            <option value="crypto">crypto</option>
            <option value="sports">sports</option>
          </select>
        </label>
        <label class="field">Min 24h vol
          <input id="flowMinVol" type="number" min="0" step="1000" value="10000" />
        </label>
        <label class="field" title="Window of aggressor (taker) fills to sum">Lookback
          <select id="flowHours">
            <option value="24" selected>24h</option>
            <option value="48">48h</option>
          </select>
        </label>
        <label class="field" title="Hide fills with USDC notional under this">Min fill $
          <input id="flowMinFill" type="number" min="0" step="1" value="0" />
        </label>
        <label class="field" title="Only count taker fills at or below this USDC size (retail tape). 0 = all takers.">Max fill $
          <input id="flowMaxFill" type="number" min="0" step="10" value="0" />
        </label>
        <label class="field" title="Hide markets where Yes or No price is above this (¢). 0 = off.">Max price ¢
          <input id="flowMaxPriceCts" type="number" min="0" max="100" step="1" value="0" />
        </label>
        <label class="field check" title="Drop fills from tracked sharp wallets">Exclude sharps
          <input id="flowSkipSharps" type="checkbox" checked />
        </label>
        <button id="flowLoad" type="button">Load</button>
      </div>

      <div class="meta" id="flowMeta"></div>
      <div class="meta"><span>tag <b id="flowTagLabel">—</b></span></div>
      <div id="flowErr" class="err" hidden></div>

      <table>
        <thead>
          <tr>
            <th class="expand-h" aria-hidden="true"></th>
            <th class="sortable num active" data-flow-sort="taker_usd" data-dir="↓" title="USDC taken off the book (aggressor fills) in the lookback window">Taker $</th>
            <th class="sortable num" data-flow-sort="orders" title="Number of taker fills in the lookback window">Orders</th>
            <th class="sortable" data-flow-sort="question">Market</th>
            <th class="num hide-sm">Y / N</th>
            <th class="sortable num" data-flow-sort="net_usd_abs" title="Taker USDC on Yes vs No. Sort is |net Yes-pressure|">Flow Y/N</th>
            <th class="sortable num" data-flow-sort="net_takers_abs" title="Unique taker wallets net-long Yes vs No">Takers Y/N</th>
            <th class="sortable num hide-sm" data-flow-sort="stronger" title="Side with positive Yes-pressure (buy Yes / sell No)">Side</th>
          </tr>
        </thead>
        <tbody id="flowBody"></tbody>
      </table>
      <p id="flowEmpty" class="sub" hidden>No markets match.</p>
    </section>

    <section id="tab-portfolio" class="tab-panel" role="tabpanel" hidden>
      <div class="bar">
        <label class="field search">Search
          <input id="portQ" type="search" placeholder="Filter positions" autocomplete="off" />
        </label>
        <label class="field" title="Hide positions with current value under this">Min value $
          <input id="portMinValue" type="number" min="0" step="10" value="10" />
        </label>
        <button id="portLoad" type="button">Refresh</button>
      </div>
      <div class="meta" id="portMeta"></div>
      <div id="portErr" class="err" hidden></div>
      <table>
        <thead>
          <tr>
            <th class="expand-h" aria-hidden="true"></th>
            <th class="sortable num" data-port-sort="currentValue" data-dir="">Value</th>
            <th class="sortable" data-port-sort="title">Market</th>
            <th class="num">Shares</th>
            <th class="num hide-sm">Avg / Now</th>
            <th class="sortable num" data-port-sort="cashPnl">PnL</th>
            <th>Sharps</th>
          </tr>
        </thead>
        <tbody id="portBody"></tbody>
      </table>
      <p id="portEmpty" class="sub" hidden>No positions match.</p>
    </section>

    <section id="tab-activity" class="tab-panel" role="tabpanel" hidden>
      <div class="bar">
        <label class="field search">Search
          <input id="actQ" type="search" placeholder="Filter activity" autocomplete="off" />
        </label>
        <label class="field" title="Hide trades with USDC value under this">Min size $
          <input id="actMinUsdc" type="number" min="0" step="1" value="100" />
        </label>
        <button id="actLoad" type="button">Refresh</button>
      </div>
      <div class="meta" id="actMeta"></div>
      <div id="actErr" class="err" hidden></div>
      <table>
        <thead>
          <tr>
            <th class="expand-h" aria-hidden="true"></th>
            <th>When</th>
            <th>Sharp</th>
            <th>Side</th>
            <th class="num">Size</th>
            <th class="num hide-sm">Price</th>
            <th>Market</th>
            <th class="num">USDC</th>
          </tr>
        </thead>
        <tbody id="actBody"></tbody>
      </table>
      <p id="actEmpty" class="sub" hidden>No activity match.</p>
    </section>
  </div>
  <script src="./app.js" defer></script>
  <script src="./sharps.js" defer></script>
  <script src="./flows.js" defer></script>
</body>
</html>
